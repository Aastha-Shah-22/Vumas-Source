name: Gemini AI Remediation
on:
  workflow_run: #Listens to other workflows
    workflows: ["Semgrep"] # Trigger after Semgrep finishes
    types: 
        - completed

permissions:
  contents: write    # Needed for the AI agent to push changes
  pull-requests: write # Needed for the AI agent to create PRs
  actions: read      # Needed to download artifacts
  checks: write      # Good practice for security-related workflows

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4 #Clones your GitHub repository into the runner
      
      # We need the SARIF file from the previous workflow
      - name: Download SARIF
        uses: actions/download-artifact@v4
        with:
          name: semgrep-sarif # You must artifact the sarif in semgrep.yml
          run-id: ${{ github.event.workflow_run.id }} # Download the artifact from the workflow run that triggered me.
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install PyGithub

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: python scripts/gemini.py